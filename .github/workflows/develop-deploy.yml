# Secrets/variables richiesti (configurare su GitHub → Settings → Secrets and variables → Actions):
#   Variables: HOSTDEV, USERNAMEDEV, PORTDEV, URLDEV (es. https://dev.maphub.it)
#   Secrets:   SSHKEYDEV, SLACK_WEBHOOK_URL
#   Secrets:   NOVA_USERNAME, NOVA_PASSWORD (ereditati da run-tests.yml)

name: Laravel deploy DEV

on:
  push:
    branches:
      - develop

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  deploy:
    name: Deploy DEV
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: SSH connection and run scripts/deploy_dev.sh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOSTDEV }}
          username: ${{ vars.USERNAMEDEV }}
          port: ${{ vars.PORTDEV }}
          key: ${{ secrets.SSHKEYDEV }}
          script: >
            git config --global --add safe.directory /var/www/html/maphub &&
            git config --global --add safe.directory /var/www/html/maphub/wm-package &&
            cd /var/www/html/maphub &&
            git pull &&
            git submodule update --init --recursive &&
            printf '#!/bin/bash\nphp artisan horizon:terminate || true\n' > scripts/horizon_terminate_wait.sh &&
            docker exec -u root
            -e GIT_CONFIG_COUNT=2
            -e GIT_CONFIG_KEY_0=safe.directory
            -e GIT_CONFIG_VALUE_0=/var/www/html/maphub
            -e GIT_CONFIG_KEY_1=safe.directory
            -e GIT_CONFIG_VALUE_1=/var/www/html/maphub/wm-package
            php-maphubdev bash scripts/deploy_dev.sh

  smoke-test:
    name: Smoke Test DEV
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app to be ready
        run: sleep 15

      - name: Health check /up
        run: curl --fail --max-time 30 --retry 3 --retry-delay 5 ${{ vars.URLDEV }}/up

      - name: Check /login
        run: curl --fail --max-time 30 --retry 3 --retry-delay 5 ${{ vars.URLDEV }}/login

  notify:
    name: Notify Slack
    needs: [tests, deploy, smoke-test]
    if: always()
    uses: ./.github/workflows/notify-slack.yml
    with:
      env_name: DEV
      tests_result: ${{ needs.tests.result }}
      deploy_result: ${{ needs.deploy.result }}
      smoke_result: ${{ needs.smoke-test.result }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


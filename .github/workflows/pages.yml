name: Deploy GitHub Pages

# Pubblica solo docs/guide/, non tutto docs/: features/, knowledge/ e howto/
# restano fuori dal sito pubblico. Il contenuto viene copiato sotto guide/ per
# mantenere gli URL già in giro (https://webmappsrl.github.io/maphub/guide/...).

on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito
        run: |
          mkdir -p _site/guide
          cp -R docs/guide/. _site/guide/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
